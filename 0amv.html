// 格式化金额
function fmtMV(v) {
    if (v == null) return '--';
    if (Math.abs(v) >= 1000000) return (v / 10000).toFixed(2) + '万亿';
    return v.toFixed(0) + '亿';
}
function fmtAmt(v) {
    if (v == null) return '--';
    return v.toFixed(2) + '万亿';
}

// 更新头部统计
function updateStats(idx) {
    const close = klineData[idx][1];
    const chg = idx > 0 ? ((close / klineData[idx-1][1] - 1) * 100) : 0;
    const w = whiteData[idx];
    const b = bbiData[idx];

    document.getElementById('stat-close').textContent = (close / 10000).toFixed(2) + '万亿';
    const chgEl = document.getElementById('stat-chg');
    chgEl.textContent = chg.toFixed(2) + '%';
    chgEl.className = 'stat-value ' + (chg >= 0 ? 'up' : 'down');

    const relEl = document.getElementById('stat-relation');
    if (w != null && b != null) {
        relEl.textContent = w > b ? '白>黄 🟢' : w < b ? '白<黄 🔴' : '白≈黄 ⚠️';
        relEl.className = 'stat-value ' + (w > b ? 'up' : 'down');
    } else {
        relEl.textContent = '--';
    }
}

            type: 'line',
            data: bbiData,
            xAxisIndex: 0,
            yAxisIndex: 0,
            symbol: 'none',
            lineStyle: { color: '#f59e0b', width: 2, type: 'solid' },
            smooth: false,
        },
    ]
};

mainChart.setOption(mainOption);

// 十字光标联动
mainChart.on('mousemove', function(params) {
    if (params.dataIndex != null) updateStats(params.dataIndex);
});
mainChart.on('datazoom', function() {
    macdChart.dispatchAction({ type: 'dataZoom', start: mainOption.dataZoom[0].start, end: mainOption.dataZoom[0].end });
});

// ============ 附图1: MACD ============
const macdChart = echarts.init(document.getElementById('macd-chart'), 'dark');
const macdOption = {
    backgroundColor: '#0f172a',
    animation: false,
    tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#334155',
        textStyle: { color: '#e2e8f0', fontSize: 12 },
        formatter: function(params) {
            const idx = params[0].dataIndex;
            let html = `<b>${categoryData[idx]}</b><br/>`;
            params.forEach(p => {
                html += `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.color};margin-right:4px"></span>${p.seriesName}: ${p.data != null ? p.data.toFixed(2) : '--'}<br/>`;
            });
            return html;
        }
    },
    grid: [
        { left: '8%', right: '3%', top: 8, bottom: 4 }
    ],
    xAxis: [{
        type: 'category',
        data: categoryData,
        boundaryGap: false,
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { show: false },
        axisTick: { show: false },
        splitLine: { show: false },
    }],
    yAxis: [{
        type: 'value',
        scale: true,
        position: 'left',
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
        splitNumber: 4,
    }],
    dataZoom: [
        { type: 'inside', xAxisIndex: 0, start: 0, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false },
    ],
    series: [
        {
            name: 'DIF',
            type: 'line',
            data: difData,
            symbol: 'none',
            lineStyle: { color: '#f59e0b', width: 1 },
        },
        {
            name: 'DEA',
            type: 'line',
            data: deaData,
            symbol: 'none',
            lineStyle: { color: '#3b82f6', width: 1 },
        },
        {
            name: 'MACD',
            type: 'bar',
            data: macdData,
            itemStyle: {
                color: function(p) { return p.data >= 0 ? '#ef4444' : '#22c55e'; }
            },
            barWidth: '60%',
        },
    ]
};
macdChart.setOption(macdOption);

// 联动缩放
macdChart.on('datazoom', function(params) {
    const opt = params.batch?.[0] || params;
    mainChart.dispatchAction({ type: 'dataZoom', start: opt.start, end: opt.end });
});

// 响应式
window.addEventListener('resize', function() {
    mainChart.resize();
    macdChart.resize();
});

// 初始状态
updateStats(klineData.length - 1);
</script>
</body>
</html>
