// 格式化金额
function fmtMV(v) {
    if (v == null) return '--';
    if (Math.abs(v) >= 1000000) return (v / 10000).toFixed(2) + '万亿';
    return v.toFixed(0) + '亿';
}
function fmtAmt(v) {
    if (v == null) return '--';
    return v.toFixed(2) + '万亿';
}

// 更新头部统计
function updateStats(idx) {
    const close = klineData[idx][1];
    const chg = idx > 0 ? ((close / klineData[idx-1][1] - 1) * 100) : 0;
    const w = whiteData[idx];
    const b = bbiData[idx];

    document.getElementById('stat-close').textContent = (close / 10000).toFixed(2) + '万亿';
    const chgEl = document.getElementById('stat-chg');
    chgEl.textContent = chg.toFixed(2) + '%';
    chgEl.className = 'stat-value ' + (chg >= 0 ? 'up' : 'down');

    const relEl = document.getElementById('stat-relation');
    if (w != null && b != null) {
        relEl.textContent = w > b ? '白>黄 🟢' : w < b ? '白<黄 🔴' : '白≈黄 ⚠️';
        relEl.className = 'stat-value ' + (w > b ? 'up' : 'down');
    } else {
        relEl.textContent = '--';
    }
}

['main-chart'].forEach(function(id) {
    var el = document.getElementById(id);
    el.addEventListener('wheel', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var opt = mainChart.getOption();
        if (!opt.dataZoom || !opt.dataZoom[0]) return;
        var dz = opt.dataZoom[0];
        var range = dz.end - dz.start;
        var delta = e.deltaY > 0 ? range * 0.15 : -range * 0.15;
        var newStart = Math.max(0, dz.start + delta);
        var newEnd = Math.min(100, dz.end + delta);
        if (newEnd - newStart < 5) { newStart = newEnd - 5; }
        mainChart.dispatchAction({ type: 'dataZoom', start: newStart, end: newEnd });
    }, { passive: false });
});

    series: [
        {
            name: 'DIF',
            type: 'line',
            data: difData,
            symbol: 'none',
            lineStyle: { color: '#f59e0b', width: 1 },
        },
        {
            name: 'DEA',
            type: 'line',
            data: deaData,
            symbol: 'none',
            lineStyle: { color: '#3b82f6', width: 1 },
        },
        {
            name: 'MACD',
            type: 'bar',
            data: macdData,
            itemStyle: {
                color: function(p) { return p.data >= 0 ? '#ef4444' : '#22c55e'; }
            },
            barWidth: '60%',
        },
    ]
};
macdChart.setOption(macdOption);

// 跨图表联动：tooltip + axisPointer
echarts.connect([mainChart, macdChart]);

// ── 统一缩放函数（同时更新主图+MACD）──
var zoomBoth = function(start, end) {
    mainChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    macdChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
};

// 监听主图 slider/inside 缩放 → 同步到 MACD
mainChart.on('datazoom', function(params) {
    var b = params.batch ? params.batch[0] : params;
    if (b && b.start !== undefined) {
        macdChart.dispatchAction({ type: 'dataZoom', start: b.start, end: b.end });
    }
});

// 缩放按钮
var zoomLevel = 100;
function zoomIn() {
    zoomLevel = Math.max(10, zoomLevel - 20);
    zoomBoth(100 - zoomLevel, 100);
}
function zoomOut() {
    zoomLevel = Math.min(100, zoomLevel + 20);
    zoomBoth(100 - zoomLevel, 100);
}
function zoomReset() {
    zoomLevel = 100;
    zoomBoth(0, 100);
}
// 按钮缩放后同步 zoomLevel
mainChart.on('datazoom', function(p) {
    var d = p.batch ? p.batch[0] : p;
    if (d && d.end !== undefined) zoomLevel = d.end - d.start;
});

// 响应式
window.addEventListener('resize', function() {
    mainChart.resize();
    macdChart.resize();
});

// 初始状态
updateStats(klineData.length - 1);
</script>
</body>
</html>
