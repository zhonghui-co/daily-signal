<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v3 原型 — 结构相关性作战图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b1220; color:#e2e8f0; font-family:-apple-system,'PingFang SC',sans-serif; font-size:13px; }
#layout { display:flex; height:100vh; height:100dvh; }
#panel { width:230px; min-width:200px; border-right:1px solid #1e293b; display:flex; flex-direction:column; }
#statusCard { padding:10px 12px; border-bottom:1px solid #1e293b; background:#0f172a; }
#statusCard .row { display:flex; justify-content:space-between; align-items:center; margin:3px 0; }
#statusCard .zone { font-weight:700; font-size:15px; }
#statusCard .red { color:#f87171; } #statusCard .green { color:#4ade80; }
#statusCard .dim { color:#94a3b8; font-size:11px; }
#progress { display:flex; gap:4px; margin:6px 0; }
#progress .step { flex:1; text-align:center; padding:3px 0; border-radius:4px; font-size:11px; background:#1e293b; color:#64748b; }
#progress .step.done { background:rgba(220,38,38,.25); color:#fca5a5; }
#progress .step.wait { background:rgba(100,116,139,.15); color:#94a3b8; }
#listHead { padding:8px 12px; font-size:12px; color:#94a3b8; border-bottom:1px solid #1e293b; }
#list { flex:1; overflow-y:auto; }
.item { padding:9px 12px; cursor:pointer; border-bottom:1px solid #0f172a; }
.item:hover { background:#111c33; }
.item.active { background:#16233f; border-left:2px solid #f87171; }
.item .l1 { display:flex; justify-content:space-between; align-items:center; }
.item .nm { font-weight:600; }
.item .l2 { display:flex; gap:6px; margin-top:3px; font-size:11px; color:#94a3b8; align-items:center; }
.badge { padding:1px 6px; border-radius:3px; font-size:11px; font-weight:600; }
.b-rev-confirm { background:#991b1b; color:#fecaca; }
.b-rev-first { background:#c2410c; color:#fed7aa; }
.b-strong { background:#7c3aed; color:#ddd6fe; }
.b-follow { background:rgba(220,38,38,.35); color:#fca5a5; }
.b-flat { background:#334155; color:#cbd5e1; }
.b-down { background:rgba(22,163,74,.35); color:#86efac; }
.b-rev { background:rgba(220,38,38,.6); color:#fee2e2; }
#charts { flex:1; display:flex; flex-direction:column; }
#chartTop { height:46%; }
#chartBottom { height:54%; }
#loading { position:fixed; top:45%; width:100%; text-align:center; color:#64748b; z-index:99; }
@media (max-width:768px){
  #layout { flex-direction:column; }
  #panel { width:100%; height:38%; border-right:none; border-bottom:1px solid #1e293b; }
  #charts { height:62%; }
  #chartTop { height:46%; } #chartBottom { height:54%; }
}
</style>
</head>
<body>
<div id="loading">加载数据中…</div>
<div id="layout">
  <div id="panel">
    <div id="statusCard"></div>
    <div id="listHead">板块状态榜（按资金进入顺序）</div>
    <div id="list"></div>
  </div>
  <div id="charts">
    <div id="chartTop"></div>
    <div id="chartBottom"></div>
  </div>
</div>
<script>
let DATA = null, sel = null;
fetch('v3-states.json', {cache:'no-store'})
  .then(r => r.json())
  .then(d => { DATA = d; DATA.allA.k = d.allA.k.o.map((_, i) => [d.allA.k.o[i], d.allA.k.h[i], d.allA.k.l[i], d.allA.k.c[i]]); init(); })
  .catch(e => { document.getElementById('loading').textContent = '数据加载失败: ' + e.message; });

/* ── 指标 ── */
function ema(arr, n) {
  const k = 2/(n+1), out = new Array(arr.length).fill(null);
  let start = arr.findIndex(v => v != null);
  if (start < 0) return out;
  let s = 0, cnt = 0;
  for (let i = start; i < Math.min(start+n, arr.length); i++) { if (arr[i] != null) { s += arr[i]; cnt++; } }
  if (cnt === 0) return out;
  let idx = start + n - 1;
  out[idx] = s / cnt;
  for (let i = idx + 1; i < arr.length; i++) {
    if (arr[i] != null) out[i] = arr[i]*k + out[i-1]*(1-k); else out[i] = out[i-1];
  }
  return out;
}
function whiteOf(closes) {
  const e10 = ema(closes, 10);
  const c = e10.map((v,i) => v != null ? v : closes[i]);
  return ema(c, 10);
}
const UP = 'rgba(220,38,38,0.09)', DN = 'rgba(22,163,74,0.09)';
function stateBands(segments, dates) {
  const areas = [];
  for (const [s,e,st] of segments) {
    if (st === 1) areas.push([{xAxis: dates[s], itemStyle:{color:UP}}, {xAxis: dates[e]}]);
    else if (st === -1) areas.push([{xAxis: dates[s], itemStyle:{color:DN}}, {xAxis: dates[e]}]);
  }
  return areas;
}
function turnArrows(segments, dates, kdata) {
  const pts = [];
  for (const [s,e,st] of segments) {
    if (st === 1 && s > 0 && kdata[s]) {
      pts.push({coord:[dates[s], kdata[s][2]*0.985], value:'▲', symbol:'arrow', symbolSize:11,
        symbolRotate:0, itemStyle:{color:'#f87171'}, label:{show:false}});
    }
  }
  return pts;
}
function klineSeries(k, name) {
  const data = k.map(v => v ? [v[0], v[3], v[2], v[1]] : null); // [open, close, low, high]
  return { type:'candlestick', name, data, itemStyle:{color:'#dc2626', color0:'#16a34a', borderColor:'#dc2626', borderColor0:'#16a34a'} };
}

let cTop = null, cBottom = null, zoomState = {start:70, end:100}, syncGuard = false;
function baseOption(k, name, state, slope, segments, dates, marks, anchorDate, extraSeries, extraAreas) {
  const closes = k.map(v => v ? v[3] : null);
  const w = whiteOf(closes);
  const series = [
    klineSeries(k, name),
    { type:'line', name:'白线', data:w, symbol:'none', lineStyle:{width:1.4, color:'#fbbf24'}, smooth:true },
  ];
  const areas = stateBands(segments, dates);
  const markPoint = (k.length===0) ? [] : turnArrows(segments, dates, k);
  series[0].markArea = { silent:true, data:[...(areas||[]), ...(extraAreas||[])] };
  series[0].markLine = {
    silent:true, symbol:'none',
    data: anchorDate ? [{xAxis:anchorDate, lineStyle:{color:'#facc15', type:'dashed', width:1}}] : [],
    label:{formatter:'锚点', position:'start', color:'#facc15', fontSize:10}
  };
  if (markPoint.length) series[0].markPoint = { silent:true, data:markPoint };
  if (marks && marks.length) {
    series[0].markPoint = Object.assign(series[0].markPoint||{}, { data: marks.map(m => ({
      coord:[dates[m.i], k[m.i]?k[m.i][2]:null], value:m.t,
      symbol:'triangle', symbolSize:11, symbolRotate: m.t==='空'?180:0,
      itemStyle:{color: m.t==='多' ? '#dc2626' : '#16a34a'},
      label:{show:true, position:'bottom', distance:5, formatter:m.t, color: m.t==='多'?'#fca5a5':'#86efac', fontSize:11, fontWeight:'bold'}
    }))});
  }
  for (const s of (extraSeries||[])) series.push(s);
  return {
    animation:false,
    backgroundColor:'transparent',
    grid:[{left:56, right:18, top:12, bottom:'32%'}],
    xAxis:[{
      type:'category', data:dates, boundaryGap:true,
      axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#64748b', fontSize:10},
    }],
    yAxis:[{ scale:true, position:'left', axisLabel:{color:'#64748b', fontSize:10}, splitLine:{lineStyle:{color:'#1e293b'}} }],
    dataZoom:[
      { type:'inside', xAxisIndex:[0,1], start:70, end:100 },
      { type:'slider', xAxisIndex:[0,1], start:70, end:100, height:14, bottom:2,
        borderColor:'#1e293b', backgroundColor:'#0f172a', fillerColor:'rgba(220,38,38,.15)',
        textStyle:{color:'#64748b', fontSize:9} }
    ],
    tooltip:{ trigger:'axis', axisPointer:{type:'cross'}, backgroundColor:'#0f172a', borderColor:'#334155', textStyle:{color:'#e2e8f0', fontSize:11} },
    series
  };
}
function slopeGridOption(slope1, slope2, dates, marks, anchorDate) {
  return {
    animation:false,
    grid:[{left:56, right:18, top:'72%', bottom:22}],
    xAxis:[{ type:'category', data:dates, axisLabel:{show:false}, axisLine:{lineStyle:{color:'#334155'}} }],
    yAxis:[{ scale:true, axisLabel:{color:'#64748b', fontSize:9}, splitLine:{lineStyle:{color:'#1e293b'}} }],
    series:[
      { type:'line', name:'斜率', data:slope1, symbol:'none', lineStyle:{width:1.2, color:'#f87171'} },
      { type:'line', name:'全A斜率', data:slope2, symbol:'none', lineStyle:{width:1.2, color:'#38bdf8'} },
      { type:'line', name:'零轴', data:dates.map(()=>0), symbol:'none', lineStyle:{width:1, color:'#475569', type:'dashed'} },
    ],
    tooltip:{ trigger:'axis', backgroundColor:'#0f172a', borderColor:'#334155', textStyle:{color:'#e2e8f0', fontSize:11} }
  };
}

function init() {
  const D = DATA, dates = D.dates, A = D.allA;
  // 状态卡
  const stTxt = {1:'上涨段', '-1':'下跌段', 0:'横盘'}[A.curState];
  const zoneTxt = A.anchorType === '多' ? '<span class="red">🔴 多头区间</span>' : '<span class="green">🟢 空头区间</span>';
  const p1 = '① 价格转多', p2 = '② 斜率转正', p3 = '③ 收复下跌段';
  const d1 = A.anchorType === '多', d2 = A.curState === 1;
  const aCl = A.k.map(v => v ? v[3] : null);
  let d3 = d2;
  if (d2) {
    const lastDown = [...A.segments].reverse().find(sg => sg[2] === -1);
    if (lastDown && aCl[aCl.length-1] != null && aCl[lastDown[0]] != null) d3 = aCl[aCl.length-1] > aCl[lastDown[0]];
  }
  document.getElementById('statusCard').innerHTML = `
    <div class="row"><span>全A v2 0AMV</span>${zoneTxt}</div>
    <div class="row"><span class="dim">锚点 ${A.anchorDate} 起 · 第${dates.length - A.anchor}天</span><span class="dim">斜率 <b style="color:${A.curSlope>=0?'#f87171':'#4ade80'}">${A.curSlope>0?'+':''}${A.curSlope}%</b></span></div>
    <div class="row"><span class="dim">距锚点</span><span class="${A.anchorPct>=0?'red':'green'}">${A.anchorPct>0?'+':''}${A.anchorPct}%</span></div>
    <div id="progress">
      <div class="step ${d1?'done':'wait'}">${p1}</div>
      <div class="step ${d2?'done':'wait'}">${p2}</div>
      <div class="step ${d3?'done':'wait'}">${p3}</div>
    </div>
    <div class="dim">当前状态：<b>${stTxt}</b>（${A.curState===1?'趋势确认中':(A.curState===-1?'反弹未确认':'震荡')}）</div>`;

  // 列表
  const listEl = document.getElementById('list');
  const badge = (s) => {
    if (s.s4 === '领涨反转') return s.tier==='确认' ? 'b-rev-confirm' : 'b-rev-first';
    if (s.s4 === '持续强势') return 'b-strong';
    if (s.s4 === '跟涨') return 'b-follow';
    if (s.s4 === '无关') return 'b-flat';
    return 'b-down';
  };
  const label = (s) => {
    if (s.s4 === '领涨反转') return `领涨反转·${s.tier}`;
    return s.s4;
  };
  for (const name of D.order) {
    const s = D.sectors[name];
    const el = document.createElement('div');
    el.className = 'item';
    const leadTxt = s.lead == null ? '—' : (s.lead < 0 ? `领先${-s.lead}天` : (s.lead === 0 ? '同步' : `滞后${s.lead}天`));
    el.innerHTML = `<div class="l1"><span class="nm">${name}</span><span class="badge ${badge(s)}">${label(s)}</span></div>
      <div class="l2"><span>斜率 ${s.curSlope>0?'+':''}${s.curSlope}%</span><span>${leadTxt}</span><span>锚点来 ${s.anchorPct>0?'+':''}${s.anchorPct}%</span></div>`;
    el.onclick = () => { select(name); };
    listEl.appendChild(el);
  }
  select(D.order[0]);
}

function select(name) {
  sel = name;
  document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.item');
  const idx = DATA.order.indexOf(name);
  if (items[idx]) items[idx].classList.add('active');
  render();
}

function render() {
  try { renderInner(); } catch(e) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').textContent = '渲染失败: ' + e.message;
  }
}
function renderInner() {
  const D = DATA, dates = D.dates, A = D.allA;
  const aK = A.k;
  const optA = baseOption(aK, '全A v2', A.state, A.slope, A.segments, dates, A.marks, A.anchorDate);
  const slA = slopeGridOption(A.slope, A.slope, dates, A.marks, A.anchorDate);
  // 合并斜率附图
  optA.grid.push(slA.grid[0]);
  optA.xAxis.push(slA.xAxis[0]);
  optA.yAxis.push(slA.yAxis[0]);
  optA.series.push(slA.series[0]);
  optA.series.push(slA.series[2]);
  if (!cTop) {
    cTop = echarts.init(document.getElementById('chartTop'));
    cTop.on('datazoom', ev => syncZoom(ev, cBottom));
  }
  cTop.setOption(optA, true);

  const s = D.sectors[sel];
  if (!s) return;
  const optS = baseOption(s.k, sel, s.state, s.slope, s.segments, dates, null, A.anchorDate,
    [{ type:'line', name:'全A斜率', data:A.slope, symbol:'none', lineStyle:{width:1, color:'#38bdf8', type:'dotted'} }]);
  const slS = slopeGridOption(s.slope, A.slope, dates, null, A.anchorDate);
  optS.grid.push(slS.grid[0]);
  optS.xAxis.push(slS.xAxis[0]);
  optS.yAxis.push(slS.yAxis[0]);
  optS.series.push(slS.series[0]);
  optS.series.push(slS.series[1]);
  optS.series.push(slS.series[2]);
  // 板块掉头箭头
  if (s.turn != null && s.k[s.turn]) {
    const cs = optS.series[0];
    cs.markPoint = Object.assign(cs.markPoint||{}, { data: (cs.markPoint?.data||[]).concat([{
      coord:[dates[s.turn], s.k[s.turn][2]*0.985], value:'掉头',
      symbol:'arrow', symbolSize:13, symbolRotate:0,
      itemStyle:{color:'#facc15'},
      label:{show:true, position:'bottom', distance:4, formatter:`掉头 ${s.turnDate}`, color:'#facc15', fontSize:10}
    }])});
  }
  if (!cBottom) {
    cBottom = echarts.init(document.getElementById('chartBottom'));
    cBottom.on('datazoom', ev => syncZoom(ev, cTop));
  }
  cBottom.setOption(optS, true);
  syncZoomFrom(zoomState);
  document.getElementById('loading').style.display = 'none';
}

function syncZoom(ev, target) {
  if (syncGuard) return;
  syncGuard = true;
  try {
    const src = ev.start != null ? ev : (ev.batch && ev.batch[0]);
    if (!src || src.start == null || src.end == null) return;
    if (Math.abs(src.start - zoomState.start) < 0.01 && Math.abs(src.end - zoomState.end) < 0.01) return;
    zoomState = {start: src.start, end: src.end};
    target.dispatchAction({type:'dataZoom', start: zoomState.start, end: zoomState.end});
  } finally { syncGuard = false; }
}
function syncZoomFrom(z) {
  if (cTop) cTop.dispatchAction({type:'dataZoom', start: z.start, end: z.end});
  if (cBottom) cBottom.dispatchAction({type:'dataZoom', start: z.start, end: z.end});
}
window.addEventListener('resize', () => { cTop && cTop.resize(); cBottom && cBottom.resize(); });
</script>
</body>
</html>
