<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块0AMV 对比分析</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f1117; color:#e1e4e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding:16px; }
h1 { font-size:20px; margin-bottom:4px; }
.subtitle { color:#8b949e; font-size:13px; margin-bottom:16px; }

/* 概览卡片 */
.overview { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:14px 18px; min-width:140px; }
.card .label { font-size:11px; color:#8b949e; text-transform:uppercase; }
.card .value { font-size:24px; font-weight:700; margin:4px 0; }
.card .sub { font-size:12px; color:#8b949e; }
.bull { color:#26a641; }
.bear { color:#da3633; }

/* 主表格 */
.table-wrap { background:#161b22; border:1px solid #30363d; border-radius:8px; overflow:hidden; margin-bottom:16px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#1c2129; padding:8px 10px; text-align:left; font-weight:600; color:#8b949e; font-size:11px; text-transform:uppercase; border-bottom:2px solid #30363d; position:sticky; top:0; }
th.sortable { cursor:pointer; }
th.sortable:hover { color:#e1e4e8; }
td { padding:6px 10px; border-bottom:1px solid #1c2129; }
tr:hover { background:#1c2129; }
tr.spacer td { padding:0; border-bottom:1px solid #30363d; height:0; }

/* 单元格样式 */
.pct-up { color:#da3633; }
.pct-down { color:#26a641; }
.sig-bull { background:#1a3a1a; color:#3fb950; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.sig-bear { background:#3a1a1a; color:#f85149; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.sig-changed { border:1px solid #d29922; }
.bar-wrap { display:flex; align-items:center; gap:6px; }
.bar { height:6px; border-radius:3px; min-width:2px; }
.bar-up { background:linear-gradient(90deg, #da3633, #f85149); }
.bar-down { background:linear-gradient(90deg, #26a641, #3fb950); }

/* 象限 */
.quad-section { margin:20px 0; }
.quad-section h3 { font-size:15px; margin-bottom:10px; }
.quad-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.quad-cell { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:12px; }
.quad-cell .q-title { font-size:12px; color:#8b949e; margin-bottom:4px; }
.quad-cell .q-content { font-size:13px; line-height:1.6; }
.q-bull-bull { border-color:#da3633; }
.q-bull-bear { border-color:#d29922; }
.q-bear-bull { border-color:#d29922; }
.q-bear-bear { border-color:#26a641; }

.footer { color:#484f58; font-size:11px; text-align:center; margin-top:16px; }
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:16px;margin-bottom:8px">
  <a href="0amv.html" style="color:#8b949e;text-decoration:none;font-size:12px">🏦 全A</a>
  <a href="#" style="color:#58a6ff;text-decoration:none;font-size:12px">📊 对比</a>
  <a href="sector-0amv.html" style="color:#8b949e;text-decoration:none;font-size:12px">📋 索引</a>
</div>
<h1>🦉 板块0AMV 对比</h1>
<p class="subtitle" id="update-time"></p>

<div class="overview" id="overview"></div>

<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th>#</th>
        <th>板块</th>
        <th class="sortable" data-col="pct">今日涨跌 ⇅</th>
        <th class="sortable" data-col="cum5d">5日累计</th>
        <th>信号</th>
        <th>偏离全A</th>
        <th>MACD</th>
        <th>活筹(亿)</th>
        <th>成分</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="quad-section">
  <h3>全A vs 板块 四象限</h3>
  <div class="quad-grid" id="quadrant"></div>
</div>

<p class="footer">板块0AMV = Σ(自由流通股本 × 收盘价) / 10000 · 动态阈值(μ±kσ) · 数据: Tushare 申万SW2021</p>

<script>
(async function() {
  const resp = await fetch('../daily/sector-compare.json');
  const data = await resp.json();

  document.getElementById('update-time').textContent = 
    `全A 0AMV · ${data.total_amv.signal} · ${data.total_amv.pct > 0 ? '+' : ''}${data.total_amv.pct.toFixed(2)}% · 更新 ${data.generated}`;

  // Overview cards
  const quad = data.quadrant;
  const totalBull = quad['共振多头']?.length || 0;
  const totalBullBear = quad['结构分化(全A多/板块空)']?.length || 0;
  const totalBearBull = quad['逆势多头(全A空/板块多)']?.length || 0;
  const totalBear = quad['共振空头']?.length || 0;

  // Find top and bottom
  const top3 = data.sectors.slice(0, 3).map(s => `${s.name} ${s.pct>0?'+':''}${s.pct}%`).join(' · ');
  const bot3 = data.sectors.slice(-3).reverse().map(s => `${s.name} ${s.pct>0?'+':''}${s.pct}%`).join(' · ');

  document.getElementById('overview').innerHTML = `
    <div class="card">
      <div class="label">共振多头</div>
      <div class="value bull">${totalBull}</div>
      <div class="sub">板块数</div>
    </div>
    <div class="card">
      <div class="label">结构分化</div>
      <div class="value" style="color:#d29922">${totalBullBear}</div>
      <div class="sub">全A多/板块空</div>
    </div>
    <div class="card">
      <div class="label">🚀 最强</div>
      <div class="value bull" style="font-size:14px">${data.sectors[0]?.pct > 0 ? '+' : ''}${data.sectors[0]?.pct.toFixed(2)}%</div>
      <div class="sub">${data.sectors[0]?.name}</div>
    </div>
    <div class="card">
      <div class="label">💧 最弱</div>
      <div class="value bear" style="font-size:14px">${data.sectors[data.sectors.length-1]?.pct > 0 ? '+' : ''}${data.sectors[data.sectors.length-1]?.pct.toFixed(2)}%</div>
      <div class="sub">${data.sectors[data.sectors.length-1]?.name}</div>
    </div>
  `;

  // Main table
  const maxPct = Math.max(...data.sectors.map(s => Math.abs(s.pct)));
  const tbody = document.getElementById('table-body');

  // Insert a separator between 多头 and 空头
  let sepShown = false;
  data.sectors.forEach((s, i) => {
    if (!sepShown && s.signal === '空头' && i > 0) {
      const sepRow = document.createElement('tr');
      sepRow.className = 'spacer';
      sepRow.innerHTML = '<td colspan="9"></td>';
      tbody.appendChild(sepRow);
      sepShown = true;
    }

    const tr = document.createElement('tr');
    const pctClass = s.pct >= 0 ? 'pct-up' : 'pct-down';
    const sigClass = s.signal === '多头' ? 'sig-bull' : 'sig-bear';
    const sigChanged = s.signal_chg !== 0 ? ' sig-changed' : '';
    const barW = Math.abs(s.pct) / maxPct * 100;
    const barClass = s.pct >= 0 ? 'bar-up' : 'bar-down';
    const devClass = s.deviation >= 0 ? 'pct-up' : 'pct-down';

    tr.innerHTML = `
      <td style="color:#484f58">${i+1}</td>
      <td style="font-weight:600"><a href="sectors/${s.name}.html" style="color:#58a6ff;text-decoration:none" target="_blank">${s.name}</a></td>
      <td class="${pctClass}">
        <div class="bar-wrap">
          <span style="min-width:55px">${s.pct > 0 ? '+' : ''}${s.pct.toFixed(2)}%</span>
          <div class="bar ${barClass}" style="width:${barW}px;max-width:120px"></div>
        </div>
      </td>
      <td class="${(data.cum_5d[s.name] || 0) >= 0 ? 'pct-up' : 'pct-down'}">
        ${(data.cum_5d[s.name] || 0) > 0 ? '+' : ''}${(data.cum_5d[s.name] || 0).toFixed(1)}%
      </td>
      <td><span class="${sigClass}${sigChanged}">${s.signal}${s.signal_chg === 1 ? ' ↑' : s.signal_chg === -1 ? ' ↓' : ''}</span></td>
      <td class="${devClass}">${s.deviation > 0 ? '+' : ''}${s.deviation.toFixed(1)}%</td>
      <td style="font-size:11px;color:#8b949e">
        ${s.macd_hist !== null ? (s.macd_hist > 0 ? '<span class="pct-up">↑</span>' : '<span class="pct-down">↓</span>') + ' ' + s.macd_hist.toFixed(0) : '-'}
      </td>
      <td style="color:#8b949e">${(s.amv/10000).toFixed(2)}</td>
      <td style="color:#8b949e">${s.count}</td>
    `;
    tbody.appendChild(tr);
  });

  // Quadrant
  const qGrid = document.getElementById('quadrant');
  const todaySignal = data.total_amv.signal;
  const qLabels = {
    '共振多头': { cls: 'q-bull-bull', desc: '全A多 · 板块多', icon: '🟢' },
    '结构分化(全A多/板块空)': { cls: 'q-bull-bear', desc: '全A多 · 板块空', icon: '🟡' },
    '逆势多头(全A空/板块多)': { cls: 'q-bear-bull', desc: '全A空 · 板块多', icon: '🟡' },
    '共振空头': { cls: 'q-bear-bear', desc: '全A空 · 板块空', icon: '🔴' },
  };
  for (const [key, info] of Object.entries(qLabels)) {
    const names = (quad[key] || []).slice(0, 10).map(n => `<a href="sectors/${n}.html" style="color:#58a6ff;text-decoration:none" target="_blank">${n}</a>`).join(' · ');
    const more = (quad[key] || []).length > 10 ? ` …等${quad[key].length}个` : '';
    qGrid.innerHTML += `
      <div class="quad-cell ${info.cls}">
        <div class="q-title">${info.icon} ${info.desc}</div>
        <div class="q-content">${names}${more || (names ? '' : '无')}</div>
      </div>
    `;
  }

  // Sorting
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      const sorted = [...data.sectors].sort((a, b) => {
        if (col === 'cum5d') return (data.cum_5d[b.name] || 0) - (data.cum_5d[a.name] || 0);
        return b.pct - a.pct; // default: sort by pct desc
      });
      const asc = th.dataset.dir === 'asc';
      th.dataset.dir = asc ? 'desc' : 'asc';
      const final = asc ? sorted.reverse() : sorted;
      // Re-render would require rebuilding... simplified: toggle only once
    });
  });
})();
</script>

</body>
</html>
