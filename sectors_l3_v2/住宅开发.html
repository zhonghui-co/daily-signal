      let chg = chgData[i]!==null? (chgData[i]>=0?'+':'')+chgData[i].toFixed(2)+'%':'—';
      let color = chgData[i]>=0?'#ef4444':'#22c55e';
      return '<b>'+s+'</b><br/>开 '+o.toFixed(2)+' 收 '+c.toFixed(2)+'<br/>低 '+l.toFixed(2)+' 高 '+h.toFixed(2)+'<br/>涨跌 <span style="color:'+color+'">'+chg+'</span>';
    }
  },
  axisPointer: { link:[{xAxisIndex:'all'}], label:{backgroundColor:'#334155'} },
  grid: [{left:60, right:20, top:10, bottom:40}],
  xAxis: [{type:'category', data:dates, gridIndex:0, boundaryGap:true, axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#64748b'}}],
  yAxis: [{scale:true, gridIndex:0, splitLine:{lineStyle:{color:'#111827'}}, axisLabel:{color:'#64748b'}}],
  dataZoom: [{type:'inside', xAxisIndex:[0,1], start:zoomRange.start, end:zoomRange.end}],
  series: [
    {name:'K线', type:'candlestick', data:klineData, xAxisIndex:0, yAxisIndex:0,
      itemStyle: {color:'#ef4444', color0:'#22c55e', borderColor:'#ef4444', borderColor0:'#22c55e'}},
    {name:'白线', type:'line', data:whiteData, xAxisIndex:0, yAxisIndex:0, symbol:'none', lineStyle:{color:'#ffffff', width:1.2}},
    {name:'黄线', type:'line', data:bbiData, xAxisIndex:0, yAxisIndex:0, symbol:'none', lineStyle:{color:'#f59e0b', width:1.2, type:'dashed'}}
  ]
};
const macdOption = {
  animation: false, backgroundColor: '#000',
  tooltip: { trigger:'axis', backgroundColor:'#0f172a', borderColor:'#334155' },
  axisPointer: { link:[{xAxisIndex:'all'}] },
  grid: {left:60, right:20, top:10, bottom:30},
  xAxis: {type:'category', data:dates, boundaryGap:true, axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#64748b'}},
  yAxis: {scale:true, splitLine:{lineStyle:{color:'#111827'}}, axisLabel:{color:'#64748b', fontSize:10}},
  dataZoom: [{type:'inside', xAxisIndex:[0], start:zoomRange.start, end:zoomRange.end}],
  series: [
    {name:'MACD', type:'bar', data:macdData, itemStyle: {color: function(p){ return macdData[p.dataIndex]>=0 ? '#ef4444' : '#22c55e'; }}, barWidth:'60%'},
    {name:'DIF', type:'line', data:difData, symbol:'none', lineStyle:{color:'#f8fafc', width:1}},
    {name:'DEA', type:'line', data:deaData, symbol:'none', lineStyle:{color:'#f59e0b', width:1}}
  ]
};
mainChart.setOption(mainOption);
macdChart.setOption(macdOption);
var syncingZoom = false;
mainChart.on('datazoom', function(ev) { if (syncingZoom) return; syncingZoom = true; zoomRange.start = ev.batch? ev.batch[0].start : ev.start; zoomRange.end = ev.batch? ev.batch[0].end : ev.end; macdChart.dispatchAction({type:'dataZoom', start:zoomRange.start, end:zoomRange.end}); syncingZoom = false; });
macdChart.on('datazoom', function(ev) { if (syncingZoom) return; syncingZoom = true; zoomRange.start = ev.batch? ev.batch[0].start : ev.start; zoomRange.end = ev.batch? ev.batch[0].end : ev.end; mainChart.dispatchAction({type:'dataZoom', start:zoomRange.start, end:zoomRange.end}); syncingZoom = false; });
document.getElementById('stat-close').textContent = latest.close.toFixed(2);
const chgEl = document.getElementById('stat-chg');
chgEl.textContent = (latest.chg>=0?'+':'')+latest.chg.toFixed(2)+'%';
chgEl.style.color = latest.chg>=0 ? '#ef4444' : '#22c55e';
document.getElementById('stat-relation').textContent = '白<黄 🔴';
window.addEventListener('resize', function(){ mainChart.resize(); macdChart.resize(); });
</script>
