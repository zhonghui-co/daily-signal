function fmtMV(v) {
    if (v == null) return '--';
    return v.toFixed(0) + '万';
}

function updateStats(idx) {
    const close = klineData[idx][1];
    const chg = idx > 0 ? ((close / klineData[idx-1][1] - 1) * 100) : 0;
    const w = whiteData[idx];
    const b = bbiData[idx];
    document.getElementById('stat-close').textContent = (close/10000).toFixed(2) + '亿';
    const chgEl = document.getElementById('stat-chg');
    chgEl.textContent = chg.toFixed(2) + '%';
    chgEl.className = 'stat-value ' + (chg >= 0 ? 'up' : 'down');
    const relEl = document.getElementById('stat-relation');
    if (w != null && b != null) {
        relEl.textContent = w > b ? '白>黄 🟢' : w < b ? '白<黄 🔴' : '白≈黄 ⚠️';

    } else {

    }
}

    axisPointer: { label: { backgroundColor: '#1e293b' } },
    grid: [{ left: '8%', right: '3%', top: 12, height: '75%' }],
    xAxis: [{
        type: 'category', data: categoryData, boundaryGap: true,
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#64748b', fontSize: 10 },
        axisTick: { show: false }, splitLine: { show: false },
        min: 'dataMin', max: 'dataMax',
    }],
    yAxis: [{
        type: 'value', scale: true, position: 'left',
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#64748b', fontSize: 10, formatter: v => (v/10000).toFixed(1)+'亿' },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
    }],
    dataZoom: [
        { type: 'inside', start: 0, end: 100 },
        { type: 'slider', start: 0, end: 100, height: 28, bottom: 8, left: '8%', right: '3%',
           backgroundColor: 'rgba(30,41,59,0.9)', fillerColor: 'rgba(56,189,248,0.15)',
           borderColor: '#334155', handleStyle: { color: '#38bdf8' },
           textStyle: { color: '#94a3b8', fontSize: 10 }, showDetail: false }
    ],
    series: [
        {
            name: 'K线', type: 'candlestick', data: klineData,
            itemStyle: { color: '#ef4444', color0: '#22c55e', borderColor: '#ef4444', borderColor0: '#22c55e' },
            markLine: { silent: true, symbol: 'none',
                data: [{ yAxis: bbiData[bbiData.length-1], lineStyle: { color: '#f59e0b', type: 'dashed', width: 1 }, label: { formatter: '黄线', color: '#f59e0b', fontSize: 10 } }]
            },
            markPoint: { data: markPoints },
            markArea: { silent: true, data: markAreas },
        },
        { name: '白线', type: 'line', data: whiteData, symbol: 'none',
           lineStyle: { color: '#ffffff', width: 1.5 }, smooth: false },
        { name: '黄线BBI', type: 'line', data: bbiData, symbol: 'none',
           lineStyle: { color: '#f59e0b', width: 2, type: 'solid' }, smooth: false },
    ]
};
mainChart.setOption(mainOption);

mainChart.on('mousemove', function(params) {
    if (params.dataIndex != null) updateStats(params.dataIndex);
});

const macdChart = echarts.init(document.getElementById('macd-chart'));
const macdOption = {
    backgroundColor: '#000000', animation: false,
    tooltip: {
        trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.95)', borderColor: '#334155',
        textStyle: { color: '#e2e8f0', fontSize: 11 },
        formatter: function(params) {
            const idx = params[0].dataIndex;
            let html = `<b>${categoryData[idx]}</b><br/>`;
            params.forEach(p => {
                html += `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.color};margin-right:4px"></span>${p.seriesName}: ${p.data != null ? p.data.toFixed(2) : '--'}<br/>`;
            });
            return html;
        }
    },
    grid: [{ left: '8%', right: '3%', top: 8, bottom: 4 }],
    xAxis: [{ type: 'category', data: categoryData, boundaryGap: true,
        axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { show: false },
        axisTick: { show: false }, splitLine: { show: false } }],
    yAxis: [{ type: 'value', scale: true, position: 'left',
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } }, splitNumber: 4 }],
    dataZoom: [{ type: 'inside', start: 0, end: 100, zoomOnMouseWheel: false, moveOnMouseMove: false, moveOnMouseWheel: false }],
    series: [
        { name: 'DIF', type: 'line', data: difData, symbol: 'none', lineStyle: { color: '#f59e0b', width: 1 } },
        { name: 'DEA', type: 'line', data: deaData, symbol: 'none', lineStyle: { color: '#3b82f6', width: 1 } },
        { name: 'MACD', type: 'bar', data: macdData,
           itemStyle: { color: function(p) { return p.data >= 0 ? '#ef4444' : '#22c55e'; } },
           barWidth: '60%' },
    ]
};
macdChart.setOption(macdOption);
echarts.connect([mainChart, macdChart]);

var zoomLevel = 100, zoomCenter = 50;
var _syncing = false;
mainChart.on('datazoom', function(p) {
    if (_syncing) return;
    var d = p.batch ? p.batch[0] : p;
    if (d && d.start !== undefined && d.end !== undefined) {
        zoomLevel = d.end - d.start; zoomCenter = (d.start + d.end) / 2;
        _syncing = true;
        macdChart.dispatchAction({ type: 'dataZoom', start: d.start, end: d.end });
        setTimeout(function() { _syncing = false; }, 50);
    }
});
macdChart.on('datazoom', function(p) {
    if (_syncing) return;
    var d = p.batch ? p.batch[0] : p;
    if (d && d.start !== undefined && d.end !== undefined) {
        _syncing = true;
        mainChart.dispatchAction({ type: 'dataZoom', start: d.start, end: d.end });
        _syncing = false;
        zoomLevel = d.end - d.start; zoomCenter = (d.start + d.end) / 2;
    }
});
function zoomIn() {
    zoomLevel = Math.max(10, zoomLevel - 20);
    var half = zoomLevel / 2;
    var start = Math.max(0, zoomCenter - half), end = Math.min(100, zoomCenter + half);
    if (end - start < zoomLevel) { end = Math.min(100, start + zoomLevel); start = Math.max(0, end - zoomLevel); }
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    macdChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    _syncing = false;
}
function zoomOut() {
    zoomLevel = Math.min(100, zoomLevel + 20);
    var half = zoomLevel / 2;
    var start = Math.max(0, zoomCenter - half), end = Math.min(100, zoomCenter + half);
    if (end - start < zoomLevel) { end = Math.min(100, start + zoomLevel); start = Math.max(0, end - zoomLevel); }
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    macdChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    _syncing = false;
}
function zoomReset() { zoomLevel = 100; zoomCenter = 50;
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
    macdChart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
    _syncing = false;
}
window.addEventListener('resize', function() { mainChart.resize(); macdChart.resize(); });
updateStats(klineData.length - 1);
</script>
</body>
</html>
