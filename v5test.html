<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v5-test — Σ(成交量×OHLC) 真实活跃市值作战图（长历史 2010-）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:13px; }
.header { padding:8px 16px; display:flex; align-items:center; justify-content:space-between;
          border-bottom:1px solid #1e293b; gap:12px; flex-shrink:0; }
.header h1 { font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.hbadge { font-size:10px; background:#3b2f1e; color:#f59e0b; padding:2px 6px; border-radius:4px; }
.header-right { display:flex; gap:12px; align-items:center; font-size:11px; color:#94a3b8; }
#loadMoreBtn { background:#0f172a; color:#38bdf8; border:1px solid #334155; border-radius:4px; padding:4px 10px; font-size:12px; cursor:pointer; }
#loadMoreBtn:hover { background:#1e293b; }
#loadMoreBtn:disabled { color:#475569; cursor:default; }
#layout { display:flex; flex:1; min-height:0; }
#panel { width:300px; min-width:280px; border-right:1px solid #1e293b; display:flex; flex-direction:column; min-height:0; }
#statusCard { padding:12px 14px; border-bottom:1px solid #1e293b; background:#0f172a; }
#statusCard .row { display:flex; justify-content:space-between; align-items:center; margin:4px 0; }
#statusCard .zone { font-weight:700; font-size:16px; }
.red { color:#f87171; } .green { color:#4ade80; }
#statusCard .dim { color:#94a3b8; font-size:11px; }
#summary { padding:8px 14px; font-size:11px; color:#cbd5e1; border-bottom:1px solid #1e293b; background:#0d1526; line-height:1.7; }
#tabs { display:flex; border-bottom:1px solid #1e293b; }
#tabs button { flex:1; background:#000; color:#64748b; border:none; padding:8px 0; font-size:13px; cursor:pointer; border-bottom:2px solid transparent; }
#tabs button.active { color:#38bdf8; border-bottom-color:#38bdf8; }
#filterbox { display:none; padding:8px 14px; border-bottom:1px solid #1e293b; background:#0d1526; }
#filterbox select { width:100%; margin:4px 0; background:#111827; color:#e2e8f0; border:1px solid #334155; border-radius:4px; padding:4px; font-size:12px; }
#list { flex:1; overflow-y:auto; }
.item { padding:7px 14px; cursor:pointer; border-bottom:1px solid #0f172a; }
.item:hover { background:#0f172a; }
.item.active { background:#1e3a5f; color:#60a5fa; border-left:2px solid #38bdf8; }
.item .l1 { display:flex; justify-content:space-between; align-items:center; }
.item .nm { font-weight:600; }
.item .l2 { display:flex; gap:8px; margin-top:4px; font-size:11px; color:#94a3b8; align-items:center; }
.badge { padding:1px 7px; border-radius:3px; font-size:10px; font-weight:600; white-space:nowrap; }
.b-up { background:rgba(220,38,38,.35); color:#fca5a5; }
.b-dn { background:rgba(22,163,74,.35); color:#86efac; }
.b-fl { background:#334155; color:#cbd5e1; }
.v4b { padding:1px 7px; border-radius:3px; font-size:10px; font-weight:600; white-space:nowrap; }
.v4-up { background:rgba(220,38,38,.3); color:#fca5a5; }
.v4-dn { background:rgba(22,163,74,.3); color:#86efac; }
.v4-fl { background:rgba(217,119,6,.35); color:#fde68a; }
#charts { flex:1; display:flex; flex-direction:column; position:relative; }
#chartTop { height:44%; }
#chartBottom { height:56%; }
#legend { position:absolute; top:8px; right:24px; font-size:11px; color:#94a3b8; display:flex; gap:12px; z-index:5; background:rgba(11,18,32,.8); padding:4px 8px; border-radius:4px; }
#legend span i { display:inline-block; width:12px; height:8px; margin-right:4px; border-radius:2px; }
.chart-label { position:absolute; left:70px; font-size:11px; color:#94a3b8; z-index:10; pointer-events:none; }
#loading { position:fixed; top:45%; width:100%; text-align:center; color:#64748b; z-index:99; }
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:8px">
    <h1>🦉 v5-test Σ(成交量×OHLC) 作战图</h1>
    <span class="hbadge" id="hbadge">长历史 2010-</span>
  </div>
  <div class="header-right">
    <span id="hstatus" style="color:#f59e0b"></span>
    <button id="loadMoreBtn" style="display:none" title="加载更早的3年数据">加载更早3年</button>
    <span id="hright"></span>
  </div>
</div>
<div id="loading">加载元数据…</div>
<div id="layout">
  <div id="panel">
    <div id="statusCard"></div>
    <div id="summary"></div>
    <div id="tabs">
      <button data-level="L1" class="active">L1</button>
      <button data-level="L2">L2</button>
      <button data-level="L3">L3</button>
    </div>
    <div id="filterbox">
      <select id="fsel1"></select>
      <select id="fsel2"></select>
    </div>
    <div id="list"></div>
  </div>
  <div id="charts">
    <div class="chart-label" style="top:6px">🏦 全市场 Σ(vol×OHLC) 亿元</div>
    <div class="chart-label" style="top:50%">📊 板块</div>
    <div id="legend">
      <span><i style="background:rgba(220,38,38,.3)"></i>N型上涨</span>
      <span><i style="background:rgba(22,163,74,.3)"></i>N型下跌</span>
      <span><i style="background:rgba(217,119,6,.3)"></i>横盘</span>
      <span style="color:#f87171">◆拐点高</span><span style="color:#4ade80">◆拐点低</span><span style="color:#94a3b8">┄N型连线</span>
      <span style="color:#dc2626">▲转多</span><span style="color:#16a34a">▼转空</span>
    </div>
    <div id="chartTop"></div>
    <div id="chartBottom"></div>
  </div>
</div>
<script>
let INDEX = null, DATA = null, sel = null, curLevel = 'L1';
let cTop = null, cBottom = null;
let zoomState = null, syncGuard = false;

const BATCH_SIZE = 3, MAX_RETRY = 3;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const yearCache = {};
let loading = false;

async function fetchJSON(url, retries) {
  let lastErr;
  for (let a = 1; a <= retries; a++) {
    try {
      const r = await fetch(url, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; if (a < retries) await sleep(600 * a); }
  }
  throw lastErr;
}
function mergeLoaded() {
  const ordered = INDEX.years.filter(y => yearCache[y]);
  DATA = mergeYears(ordered.map(y => yearCache[y]));
}
function loadedCount() { return Object.keys(yearCache).length; }
function updateLoadUI() {
  const btn = document.getElementById('loadMoreBtn');
  const badge = document.getElementById('hbadge');
  const total = INDEX.years.length, n = loadedCount();
  badge.textContent = n >= total ? `全量 ${total} 年` : `已加载 ${n}/${total} 年`;
  if (n >= total) { btn.style.display = 'none'; return; }
  btn.style.display = 'inline-block';
  btn.disabled = loading;
  btn.textContent = loading ? '加载中…' : `加载更早 ${Math.min(BATCH_SIZE, total - n)} 年`;
}
function setStatus(msg) { document.getElementById('hstatus').textContent = msg; }

async function loadYears(years, isInitial) {
  const l = document.getElementById('loading');
  loading = true;
  if (isInitial) l.textContent = `加载年份数据 ${years[0]}–${years[years.length-1]}…`;
  updateLoadUI();
  const results = await Promise.allSettled(years.map(y => fetchJSON(`v5test-data/${y}.json`, MAX_RETRY)));
  const failed = [];
  years.forEach((y, i) => {
    if (results[i].status === 'fulfilled') yearCache[y] = results[i].value;
    else failed.push(y);
  });
  loading = false;
  if (!loadedCount()) {
    l.innerHTML = '数据加载失败（网络错误）<br/><button onclick="boot()">重试</button>';
    updateLoadUI();
    return;
  }
  if (isInitial) {
    mergeLoaded();
    init();
  } else {
    const win = captureWindow();
    zoomState = null;
    mergeLoaded();
    render();
    if (win) applyWindow(win);
    updateDataInfo();
  }
  setStatus(failed.length ? `⚠️ 加载失败: ${failed.join(', ')}，点按钮重试` : '');
  updateLoadUI();
}

async function boot() {
  const l = document.getElementById('loading');
  l.textContent = '加载元数据…';
  try {
    INDEX = await fetchJSON('v5test-data/index.json', MAX_RETRY);
  } catch (e) {
    l.innerHTML = `元数据加载失败: ${e.message}<br/><button onclick="boot()">重试</button>`;
    return;
  }
  await loadYears(INDEX.years.slice(-BATCH_SIZE), true);
}
document.getElementById('loadMoreBtn').onclick = async () => {
  if (loading) return;
  const unloaded = INDEX.years.filter(y => !yearCache[y]);
  if (!unloaded.length) return;
  await loadYears(unloaded.slice(-BATCH_SIZE), false);
};
boot();

function mergeYears(parts) {
  const dates = [];
  const A = { k:[], state:[], slope:[], white:[], segments:[], swings:[], marks:[] };
  const sectors = {};
  let off = 0;
  for (const p of parts) {
    for (const dt of p.dates) dates.push(dt);
    A.k.push(...p.allA.k);
    A.state.push(...p.allA.state);
    A.slope.push(...p.allA.slope);
    A.white.push(...p.allA.white);
    for (const [s, e, st] of p.allA.segments) A.segments.push([s + off, e + off, st]);
    for (const sw of p.allA.swings) A.swings.push({ i: sw.i + off, t: sw.t, v: sw.v });
    for (const m of p.allA.marks) A.marks.push({ i: m.i + off, t: m.t });
    for (const [code, s] of Object.entries(p.sectors)) {
      if (!sectors[code]) {
        sectors[code] = { k:[], state:[], slope:[], white:[], segments:[], swings:[] };
      }
      const so = sectors[code];
      so.k.push(...s.k);
      so.state.push(...s.state);
      so.slope.push(...s.slope);
      so.white.push(...s.white);
      for (const [s2, e2, st] of s.segments) so.segments.push([s2 + off, e2 + off, st]);
      for (const sw of s.swings) so.swings.push({ i: sw.i + off, t: sw.t, v: sw.v });
    }
    off += p.dates.length;
  }
  function glue(segs) {
    const gapOk = (a, b) => {
      const t0 = new Date(String(dates[a]).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')).getTime();
      const t1 = new Date(String(dates[b]).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')).getTime();
      return (t1 - t0) / 86400000 <= 10;
    };
    for (let i = segs.length - 1; i > 0; i--) {
      if (segs[i][2] === segs[i-1][2] && segs[i][0] === segs[i-1][1] + 1 && gapOk(segs[i-1][1], segs[i][0])) {
        segs[i-1][1] = segs[i][1];
        segs.splice(i, 1);
      }
    }
  }
  glue(A.segments);
  for (const code of Object.keys(sectors)) glue(sectors[code].segments);
  return { dates, allA: A, sectors };
}

function stateBands(segments, dates) {
  const UP = 'rgba(220,38,38,0.07)', DN = 'rgba(22,163,74,0.07)', FL = 'rgba(217,119,6,0.14)';
  const areas = [];
  for (const [s, e, st] of segments) {
    if (s >= dates.length || e >= dates.length) continue;
    const color = st === 1 ? UP : st === -1 ? DN : FL;
    areas.push([{xAxis: dates[s], itemStyle:{color}}, {xAxis: dates[e]}]);
  }
  return areas;
}
function klineSeries(k) {
  const data = k.map(v => v ? [v[0], v[3], v[2], v[1]] : null);
  return { type:'candlestick', name:'K', data, itemStyle:{color:'#dc2626', color0:'#16a34a', borderColor:'#dc2626', borderColor0:'#16a34a'} };
}

function buildOption(k, name, state, slope, segments, dates, marks, anchorDate, swings, white) {
  const closes = k.map(v => v ? v[3] : null);
  const pcts = [null];
  for (let i = 1; i < closes.length; i++) {
    if (closes[i-1] && closes[i]) pcts.push(+((closes[i]-closes[i-1])/closes[i-1]*100).toFixed(2));
    else pcts.push(null);
  }
  const w = white || closes.map(() => null);
  const series = [
    klineSeries(k),
    { type:'line', name:'白线', data:w, symbol:'none', lineStyle:{width:1.4, color:'#fbbf24'}, smooth:true },
  ];
  series[0].markArea = { silent:true, data:stateBands(segments, dates) };
  series[0].markLine = {
    silent:true, symbol:'none',
    data: anchorDate && dates.includes(anchorDate) ? [{xAxis:anchorDate, lineStyle:{color:'#facc15', type:'dashed', width:1}}] : [],
    label:{formatter:'最近标记', position:'start', color:'#facc15', fontSize:10}
  };
  let mp = {};
  if (marks && marks.length) {
    mp.data = marks.map(m => {
      const isDuo = m.t === '多';
      const y = k[m.i] ? (isDuo ? k[m.i][2] : k[m.i][1]) : null;
      return {
        coord:[dates[m.i], y], value:m.t,
        symbol:'triangle', symbolSize:11, symbolRotate: isDuo ? 0 : 180,
        itemStyle:{color: isDuo ? '#dc2626' : '#16a34a'},
        label:{show:true, position: isDuo ? 'bottom' : 'top', distance:5, formatter:m.t, color: isDuo ? '#fca5a5':'#86efac', fontSize:11, fontWeight:'bold'}
      };
    });
  }
  if (mp.data && mp.data.length) series[0].markPoint = { silent:true, data:mp.data };
  if (swings && swings.length) {
    const zig = new Array(dates.length).fill(null);
    for (const sw of swings) if (sw.i < dates.length) zig[sw.i] = sw.v;
    series.push({ type:'line', name:'N型', data:zig, connectNulls:true, symbol:'none', lineStyle:{width:1.2, color:'#94a3b8', type:'dashed'} });
    series.push({ type:'scatter', name:'拐点', data: swings.filter(sw=>sw.i<dates.length).map(sw => ({value:[dates[sw.i], sw.v], symbol:'diamond', symbolSize:8, itemStyle:{color: sw.t==='H' ? '#ef4444' : '#22c55e'}})) });
  }
  const n = dates.length;
  const dStart = n > 100 ? +((n - 100) / n * 100).toFixed(2) : 0;
  return {
    animation:false, backgroundColor:'transparent',
    grid:[{left:60, right:20, top:14, bottom:'30%'}],
    xAxis:[{ type:'category', data:dates, boundaryGap:true,
      axisLine:{lineStyle:{color:'#334155'}}, axisLabel:{color:'#64748b', fontSize:10} }],
    yAxis:[{ scale:true, position:'left', axisLabel:{color:'#64748b', fontSize:10}, splitLine:{lineStyle:{color:'#1e293b'}} }],
    dataZoom:[
      { type:'inside', xAxisIndex:0, start:dStart, end:100 },
      { type:'slider', xAxisIndex:0, start:dStart, end:100, height:16, bottom:2,
        borderColor:'#1e293b', backgroundColor:'#0f172a', fillerColor:'rgba(220,38,38,.15)',
        textStyle:{color:'#64748b', fontSize:10} }
    ],
    tooltip:{ trigger:'axis', axisPointer:{type:'cross', link:[{xAxisIndex:'all'}]},
      backgroundColor:'#000', borderColor:'#334155', textStyle:{color:'#e2e8f0', fontSize:11},
      formatter: function(params) {
        const i = params[0].dataIndex;
        const krow = k[i];
        let html = `<div style="font-weight:700">${name} ${dates[i]}</div>`;
        if (krow) {
          const chg = pcts[i];
          const c = chg == null ? '#94a3b8' : (chg >= 0 ? '#ef4444' : '#22c55e');
          html += `O ${krow[0]} H ${krow[1]} L ${krow[2]} C ${krow[3]} (亿)<br/>`;
          html += `日涨幅 <b style="color:${c}">${chg==null?'—':(chg>0?'+':'')+chg.toFixed(2)+'%'}</b>`;
        }
        return html;
      } },
    series
  };
}
function attachSlopeSub(opt, slopeMain, slopeRef, dates) {
  opt.grid.push({left:60, right:20, top:'74%', bottom:22});
  opt.xAxis.push({ gridIndex:1, type:'category', data:dates, axisLabel:{show:false}, axisLine:{lineStyle:{color:'#334155'}} });
  opt.yAxis.push({ gridIndex:1, scale:true, axisLabel:{color:'#64748b', fontSize:9}, splitLine:{lineStyle:{color:'#1e293b'}} });
  opt.series.push({ xAxisIndex:1, yAxisIndex:1, type:'line', name:'斜率', data:slopeMain, symbol:'none', lineStyle:{width:1.2, color:'#f87171'} });
  opt.series.push({ xAxisIndex:1, yAxisIndex:1, type:'line', name:'全市场斜率', data:slopeRef, symbol:'none', lineStyle:{width:1.2, color:'#38bdf8'} });
  opt.series.push({ xAxisIndex:1, yAxisIndex:1, type:'line', name:'零轴', data:dates.map(()=>0), symbol:'none', lineStyle:{width:1, color:'#475569', type:'dashed'} });
  return opt;
}

function init() {
  const A = INDEX.allA;
  const stTxt = {1:'上涨段', '-1':'下跌段', 0:'横盘'}[A.curState];
  const v4Txt = {1:'N型上涨', '-1':'N型下跌', 0:'横盘'}[A.v4cur];
  const zoneTxt = A.anchorType === '多' ? '<span class="red">🟢 多头区间</span>' : '<span class="green">🔴 空头区间</span>';
  const lk = A.lastK || [null,null,null,null];
  document.getElementById('statusCard').innerHTML = `
    <div class="row"><span>全市场 · Σ(成交量×OHLC)</span>${zoneTxt}</div>
    <div class="row"><span class="dim">最近标记 ${A.anchorDate || '—'}</span>
      <span class="dim">日涨幅 <b style="color:${A.anchorPct>=0?'#f87171':'#4ade80'}">${A.anchorPct>0?'+':''}${A.anchorPct}%</b></span></div>
    <div class="row"><span class="dim">当日四档(亿)</span>
      <span class="dim">O ${lk[0]} H ${lk[1]} L ${lk[2]} C ${lk[3]}</span></div>
    <div class="row"><span class="dim">斜率 <b style="color:${A.curSlope>=0?'#f87171':'#4ade80'}">${A.curSlope>0?'+':''}${A.curSlope}%</b></span>
      <span class="dim">N型: <b style="color:${A.v4cur===1?'#ef4444':(A.v4cur===-1?'#22c55e':'#f59e0b')}">${v4Txt}</b></span></div>
    <div class="dim" id="dataInfo"></div>`;
  updateDataInfo();
  document.getElementById('hright').innerHTML =
    `${zoneTxt} · 日涨幅 <b style="color:${A.anchorPct>=0?'#ef4444':'#22c55e'}">${A.anchorPct>0?'+':''}${A.anchorPct}%</b> · ${stTxt}`;
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('button[data-level]');
    if (!btn) return;
    curLevel = btn.dataset.level;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
    renderFilterBox();
    renderSummary();
    renderList();
  });
  const s1 = document.getElementById('fsel1'), s2 = document.getElementById('fsel2');
  s1.onchange = () => { if (curLevel === 'L3') fillL3Sel2(); renderSummary(); renderList(); };
  s2.onchange = () => { renderSummary(); renderList(); };
  renderFilterBox();
  renderSummary();
  renderList();
}

function l3CodesFor(l2code) {
  const out = [];
  for (const l1 of INDEX.tree) for (const l2 of l1.children) if (l2.code === l2code) for (const l3 of l2.children) out.push(l3.code);
  return out;
}
function renderFilterBox() {
  const box = document.getElementById('filterbox');
  const sel1 = document.getElementById('fsel1');
  const sel2 = document.getElementById('fsel2');
  if (curLevel === 'L1') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  if (curLevel === 'L2') {
    sel2.style.display = 'none';
    if (sel1.dataset.mode !== 'L2') {
      sel1.dataset.mode = 'L2';
      sel1.innerHTML = '';
      sel1.add(new Option('全部 L1（默认）', ''));
      for (const n of INDEX.tree) sel1.add(new Option(n.name, n.code));
    }
    return;
  }
  sel2.style.display = 'block';
  if (sel1.dataset.mode !== 'L3') {
    sel1.dataset.mode = 'L3';
    sel1.innerHTML = '';
    for (const n of INDEX.tree) sel1.add(new Option(n.name, n.code));
  }
  fillL3Sel2();
}
function fillL3Sel2() {
  const sel1 = document.getElementById('fsel1');
  const sel2 = document.getElementById('fsel2');
  sel2.innerHTML = '';
  const l1node = INDEX.tree.find(n => n.code === sel1.value);
  for (const c of (l1node ? l1node.children : [])) sel2.add(new Option(c.name, c.code));
}
function currentCodes() {
  if (curLevel === 'L1') return INDEX.orders.L1 || [];
  if (curLevel === 'L2') {
    const l1code = document.getElementById('fsel1').value;
    if (!l1code) return INDEX.orders.L2 || [];
    const l1node = INDEX.tree.find(n => n.code === l1code);
    const set = new Set((l1node ? l1node.children : []).map(c => c.code));
    return (INDEX.orders.L2 || []).filter(c => set.has(c));
  }
  const l2code = document.getElementById('fsel2').value;
  const set = new Set(l3CodesFor(l2code));
  return (INDEX.orders.L3 || []).filter(c => set.has(c));
}
function renderSummary() {
  const codes = currentCodes();
  const cur = c => {
    const S = DATA.sectors[c];
    const n = S ? S.state.length : 0;
    return n ? S.state[n-1] : 0;
  };
  const nUp = codes.filter(c => cur(c) === 1).length;
  const nDn = codes.filter(c => cur(c) === -1).length;
  const nFl = codes.filter(c => cur(c) === 0).length;
  const dchg = c => {
    const S = DATA.sectors[c];
    const n = S ? S.k.length : 0;
    if (n < 2 || !S.k[n-1] || !S.k[n-2]) return null;
    return (S.k[n-1][3]/S.k[n-2][3]-1)*100;
  };
  const nRed = codes.filter(c => (dchg(c)||0) > 0).length;
  const nGrn = codes.filter(c => (dchg(c)||0) < 0).length;
  const aCur = INDEX.allA.v4cur;
  const aTxt = aCur === 1 ? '<b class="red">N型上涨</b>' : aCur === -1 ? '<b class="green">N型下跌</b>' : '<b style="color:#f59e0b">横盘</b>';
  document.getElementById('summary').innerHTML =
    `<b>${curLevel}</b> ${codes.length}个：N型上涨 <b class="red">${nUp}</b> · N型下跌 <b class="green">${nDn}</b> · 横盘 <b style="color:#f59e0b">${nFl}</b><br/>` +
    `当日涨 <b class="red">${nRed}</b> · 跌 <b class="green">${nGrn}</b> · 全市场 ${aTxt}`;
}
function renderList() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  const codes = currentCodes();
  const A = DATA.allA;
  const aC = A.k.length ? A.k[A.k.length-1] : null;
  for (const code of codes) {
    const S = DATA.sectors[code];
    if (!S) continue;
    const n = S.k.length;
    if (!n || !S.k[n-1]) continue;
    const meta = INDEX.sectors[code] || {};
    const chg = n > 1 && S.k[n-2] ? (S.k[n-1][3]/S.k[n-2][3]-1)*100 : null;
    const v4 = S.state[n-1];
    const v4b = v4 === 1 ? '<span class="v4b v4-up">N涨</span>' : v4 === -1 ? '<span class="v4b v4-dn">N跌</span>' : '<span class="v4b v4-fl">N横</span>';
    const chgB = chg == null ? '<span class="badge b-fl">—</span>' : (chg >= 0 ? `<span class="badge b-up">+${chg.toFixed(2)}%</span>` : `<span class="badge b-dn">${chg.toFixed(2)}%</span>`);
    const sl = S.slope[n-1];
    const share = aC && aC[3] ? (S.k[n-1][3]/aC[3]*100) : 0;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="l1"><span class="nm">${meta.name || code}</span><span style="display:flex;gap:6px;align-items:center">${chgB}${v4b}</span></div>
      <div class="l2"><span>斜率 ${sl==null?'—':((sl>0?'+':'')+sl+'%')}</span><span>C ${S.k[n-1][3]}亿</span><span>占全市场 ${share.toFixed(1)}%</span></div>`;
    el.onclick = () => select(code);
    listEl.appendChild(el);
  }
  if (codes.length) select(codes[0]);
}

function select(code) {
  sel = code;
  document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.item');
  const idx = currentCodes().indexOf(code);
  if (items[idx]) items[idx].classList.add('active');
  render();
}

function render() {
  const dates = DATA.dates, A = DATA.allA;
  const anchorDate = INDEX.allA.anchorDate;
  const optA = buildOption(A.k, '全市场', A.state, A.slope, A.segments, dates, A.marks, anchorDate, A.swings, A.white);
  attachSlopeSub(optA, A.slope, A.slope, dates);
  if (!cTop) {
    cTop = echarts.init(document.getElementById('chartTop'));
    cTop.on('datazoom', ev => syncZoom(ev, cBottom));
  }
  cTop.setOption(optA, true);
  const s = DATA.sectors[sel];
  if (s) {
    const nm = INDEX.sectors[sel] ? INDEX.sectors[sel].name : sel;
    const optS = buildOption(s.k, nm, s.state, s.slope, s.segments, dates, null, anchorDate, s.swings, s.white);
    attachSlopeSub(optS, s.slope, A.slope, dates);
    if (!cBottom) {
      cBottom = echarts.init(document.getElementById('chartBottom'));
      cBottom.on('datazoom', ev => syncZoom(ev, cTop));
    }
    echarts.connect([cTop, cBottom]);
    cBottom.setOption(optS, true);
  }
  if (zoomState) syncZoomFrom(zoomState);
  document.getElementById('loading').style.display = 'none';
}

function updateDataInfo() {
  const el = document.getElementById('dataInfo');
  if (el && INDEX) {
    el.innerHTML = `数据 ${INDEX.generated} · <b>${DATA.dates.length}</b> 交易日 · ${INDEX.params.metric} · W=${INDEX.params.W}`;
  }
}

function captureWindow() {
  if (!zoomState || !DATA || !DATA.dates.length) return null;
  const n = DATA.dates.length;
  const i0 = Math.max(0, Math.floor(zoomState.start / 100 * (n - 1)));
  const i1 = Math.min(n - 1, Math.floor(zoomState.end / 100 * (n - 1)));
  return [DATA.dates[i0], DATA.dates[i1]];
}
function applyWindow(win) {
  const dates = DATA.dates, n = dates.length;
  let i0 = dates.indexOf(win[0]), i1 = dates.indexOf(win[1]);
  if (i0 < 0) i0 = 0;
  if (i1 < 0) i1 = n - 1;
  zoomState = { start: +((i0 / (n - 1)) * 100).toFixed(3), end: +((i1 / (n - 1)) * 100).toFixed(3) };
  syncZoomFrom(zoomState);
}
function syncZoom(ev, target) {
  if (syncGuard) return;
  syncGuard = true;
  try {
    const src = ev.start != null ? ev : (ev.batch && ev.batch[0]);
    if (!src || src.start == null || src.end == null) return;
    if (zoomState && Math.abs(src.start - zoomState.start) < 0.01 && Math.abs(src.end - zoomState.end) < 0.01) return;
    zoomState = {start: src.start, end: src.end};
    if (target) target.dispatchAction({type:'dataZoom', start: zoomState.start, end: zoomState.end});
  } finally { syncGuard = false; }
}
function syncZoomFrom(z) {
  if (cTop) cTop.dispatchAction({type:'dataZoom', start: z.start, end: z.end});
  if (cBottom) cBottom.dispatchAction({type:'dataZoom', start: z.start, end: z.end});
}
window.addEventListener('resize', () => { cTop && cTop.resize(); cBottom && cBottom.resize(); });
</script>
