// 格式化金额
function fmtMV(v) {
    if (v == null) return '--';
    if (Math.abs(v) >= 1000000) return (v / 10000).toFixed(2) + '万亿';
    return v.toFixed(0) + '亿';
}
function fmtAmt(v) {
    if (v == null) return '--';
    return v.toFixed(2) + '万亿';
}

// 更新头部统计
function updateStats(idx) {
    const close = klineData[idx][1];
    const chg = idx > 0 ? ((close / klineData[idx-1][1] - 1) * 100) : 0;
    const w = whiteData[idx];
    const b = bbiData[idx];

    document.getElementById('stat-close').textContent = (close / 10000).toFixed(2) + '万亿';
    const chgEl = document.getElementById('stat-chg');
    chgEl.textContent = chg.toFixed(2) + '%';
    chgEl.className = 'stat-value ' + (chg >= 0 ? 'up' : 'down');

    const relEl = document.getElementById('stat-relation');
    if (w != null && b != null) {
        relEl.textContent = w > b ? '白>黄 🟢' : w < b ? '白<黄 🔴' : '白≈黄 ⚠️';
        relEl.className = 'stat-value ' + (w > b ? 'up' : 'down');
    } else {
        relEl.textContent = '--';
    }
}

        textStyle: { color: '#e2e8f0', fontSize: 12 },
        formatter: function(params) {
            const idx = params[0].dataIndex;
            let html = `<b>${categoryData[idx]}</b><br/>`;
            params.forEach(p => {
                html += `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.color};margin-right:4px"></span>${p.seriesName}: ${p.data != null ? p.data.toFixed(2) : '--'}<br/>`;
            });
            return html;
        }
    },
    grid: [
        { left: '8%', right: '3%', top: 8, bottom: 4 }
    ],
    xAxis: [{
        type: 'category',
        data: categoryData,
        boundaryGap: true,
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { show: false },
        axisTick: { show: false },
        splitLine: { show: false },
    }],
    yAxis: [{
        type: 'value',
        scale: true,
        position: 'left',
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
        splitNumber: 4,
    }],
    dataZoom: [
        {
            type: 'inside',
            start: 0,
            end: 100,
            zoomOnMouseWheel: false,
            moveOnMouseMove: false,
            moveOnMouseWheel: false,
            disabled: false,
        }
    ],
    series: [
        {
            name: 'DIF',
            type: 'line',
            data: difData,
            symbol: 'none',
            lineStyle: { color: '#f59e0b', width: 1 },
        },
        {
            name: 'DEA',
            type: 'line',
            data: deaData,
            symbol: 'none',
            lineStyle: { color: '#3b82f6', width: 1 },
        },
        {
            name: 'MACD',
            type: 'bar',
            data: macdData,
            itemStyle: {
                color: function(p) { return p.data >= 0 ? '#ef4444' : '#22c55e'; }
            },
            barWidth: '60%',
        },
    ]
};
macdChart.setOption(macdOption);

// 跨图表联动：tooltip + axisPointer
echarts.connect([mainChart, macdChart]);

// ── 缩放按钮（基于当前视野中心缩放，不丢失位置）──
var zoomLevel = 100;
var zoomCenter = 50;  // 当前视野中心位置（%）

// 统一监听 dataZoom：同步更新 zoomLevel / zoomCenter + 同步 MACD
var _syncing = false;
mainChart.on('datazoom', function(p) {
    if (_syncing) return;
    var d = p.batch ? p.batch[0] : p;
    if (d && d.start !== undefined && d.end !== undefined) {
        zoomLevel = d.end - d.start;
        zoomCenter = (d.start + d.end) / 2;
        // 同步到 MACD
        _syncing = true;
        macdChart.dispatchAction({ type: 'dataZoom', start: d.start, end: d.end });
        setTimeout(function() { _syncing = false; }, 50);
    }
});

macdChart.on('datazoom', function(p) {
    if (_syncing) return;
    var d = p.batch ? p.batch[0] : p;
    if (d && d.start !== undefined && d.end !== undefined) {
        // MACD 缩放时反向同步主图
        _syncing = true;
        mainChart.dispatchAction({ type: 'dataZoom', start: d.start, end: d.end });
        _syncing = false;
        zoomLevel = d.end - d.start;
        zoomCenter = (d.start + d.end) / 2;
    }
});

function zoomIn() {
    zoomLevel = Math.max(10, zoomLevel - 20);
    var half = zoomLevel / 2;
    var start = Math.max(0, zoomCenter - half);
    var end = Math.min(100, zoomCenter + half);
    if (end - start < zoomLevel) { end = Math.min(100, start + zoomLevel); start = Math.max(0, end - zoomLevel); }
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    macdChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    _syncing = false;
}
function zoomOut() {
    zoomLevel = Math.min(100, zoomLevel + 20);
    var half = zoomLevel / 2;
    var start = Math.max(0, zoomCenter - half);
    var end = Math.min(100, zoomCenter + half);
    if (end - start < zoomLevel) { end = Math.min(100, start + zoomLevel); start = Math.max(0, end - zoomLevel); }
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    macdChart.dispatchAction({ type: 'dataZoom', start: start, end: end });
    _syncing = false;
}
function zoomReset() {
    zoomLevel = 100;
    zoomCenter = 50;
    _syncing = true;
    mainChart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
    macdChart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
    _syncing = false;
}

// 响应式
window.addEventListener('resize', function() {
    mainChart.resize();
    macdChart.resize();
});

// 初始状态
updateStats(klineData.length - 1);
</script>
</body>
</html>
